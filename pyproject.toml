[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-scanning-api"
version = "0.1.0"
description = "FastAPI service for multi-stage malicious URL analysis."
readme = "docs/README.md"
authors = [
    { name = "Umut Bayram" }
]
license = { text = "AGPL-3.0" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-whois>=0.9.4",
    "dnspython>=2.5.0",
    "tldextract>=5.1.0",
    "playwright>=1.41.0",
    "cryptography>=42.0.0",
    "lightgbm>=4.3.0",
    "transformers>=4.38.0",
    "Pillow>=10.2.0",
    "numpy>=1.21.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "pefile>=2023.2.7",
    "signify>=0.5.2",
]

[project.optional-dependencies]
train = [
    "datasets>=2.15.0",
    "accelerate>=0.25.0",
    "pycocotools>=2.0.6",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "tensorboard>=2.10.0",
]
dev = [
    "black==24.10.0",
    "ruff==0.6.8",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.1",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/secsuite"
Repository = "https://github.com/secsuite/url-scanning-api.git"

[tool.pytest.ini_options]
markers = [
    "requires_safe_browsing_key: skip if GOOGLE_SAFE_BROWSING_API_KEY is not set",
    "requires_virustotal_key: skip if VIRUSTOTAL_API_KEY is not set",
]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '''
(
  app/ml/models
)
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/ml/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
exclude = "app/ml/models"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.setuptools.packages.find]
include = ["app*"]
